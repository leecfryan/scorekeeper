<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Score Keeper</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

    <style>
        body {
            background: #f5f7fb;
        }

        .score-card {
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(16, 24, 40, 0.10);
        }

        .score-figure img {
            object-fit: cover;
        }

        /* Fix the overlap: tighten title/subtitle spacing safely */
        .header-title {
            line-height: 1.15;
            margin-bottom: 0.25rem !important;
        }

        .header-subtitle {
            margin-top: 0 !important;
            line-height: 1.3;
        }

        /* Make score numbers align nicely */
        .score-value {
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }

        /* Mobile: stack nicely, ensure full width buttons */
        @media (max-width: 768px) {
            .header-row {
                flex-direction: column;
                gap: 0.75rem;
            }

            .header-row .tag {
                align-self: flex-start;
            }
        }
    </style>
</head>

<body>
    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-5-desktop is-7-tablet is-12-mobile">

                    <div class="card score-card">
                        <div class="card-image">
                            <figure class="image is-4by3 score-figure">
                                <img src="img.jpg" alt="Ping pong">
                            </figure>
                        </div>

                        <div class="card-content">
                            <!-- Header (no more overlap) -->
                            <div
                                class="is-flex is-justify-content-space-between is-align-items-flex-start header-row mb-4">
                                <div>
                                    <p class="title is-4 header-title">Ping Pong Score Keeper</p>
                                    <p class="subtitle is-6 has-text-grey header-subtitle">
                                        Use the buttons below to keep score
                                    </p>
                                </div>
                                <span class="tag is-light">🏓 Match</span>
                            </div>

                            <!-- Score -->
                            <div class="has-text-centered mb-5">
                                <p class="title is-1 score-value mb-2">
                                    <span id="p1Display">0</span>
                                    <span class="has-text-grey-light">to</span>
                                    <span id="p2Display">0</span>
                                </p>
                                <p class="help has-text-grey">First to the target score wins.</p>
                            </div>

                            <!-- Controls -->
                            <div class="columns is-variable is-4 is-vcentered mb-2">
                                <div class="column">
                                    <div class="field">
                                        <label for="playto" class="label">Playing to</label>
                                        <div class="control">
                                            <div class="select is-fullwidth">
                                                <select id="playto">
                                                    <option value="3">3</option>
                                                    <option value="4">4</option>
                                                    <option value="5" selected>5</option>
                                                    <option value="6">6</option>
                                                    <option value="7">7</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="column">
                                    <div class="notification is-light">
                                        <p class="has-text-grey is-size-7 mb-1">Tip</p>
                                        <p class="is-size-6">Use <strong>Reset</strong> to start a new game quickly.</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Buttons (equal width, aligned, nicer on mobile) -->
                            <div class="columns is-variable is-2 mt-4">
                                <div class="column">
                                    <button id="p1Button" class="button is-primary is-medium is-fullwidth">
                                        +1 Player One
                                    </button>
                                </div>
                                <div class="column">
                                    <button id="p2Button" class="button is-info is-medium is-fullwidth">
                                        +1 Player Two
                                    </button>
                                </div>
                                <div class="column">
                                    <button id="reset" class="button is-danger is-medium is-fullwidth">
                                        Reset
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <script src="app.js"></script>
</body>

</html>
